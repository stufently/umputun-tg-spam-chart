apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: {{ .Values.tgspam.fsGroup | default 1000 }}
{{- if .Values.tgspam.initContainer.enabled }}
      initContainers:
        - name: volume-permissions
          image: {{ .Values.tgspam.initContainer.image | default "busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d" | quote }}
          command:
            - sh
            - -c
            - chown -R {{ .Values.tgspam.fsGroup | default 1000 }}:{{ .Values.tgspam.fsGroup | default 1000 }} {{ .Values.tgspam.volumeMountPath }} && chmod -R 755 {{ .Values.tgspam.volumeMountPath }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: tg-data
              mountPath: {{ .Values.tgspam.volumeMountPath }}
{{- end }}
      containers:
        - name: tg-spam
          image: "{{ .Values.tgspam.image.repository }}:{{ .Values.tgspam.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tgspam.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: {{ .Values.tgspam.runAsUser | default 1000 }}
            runAsGroup: {{ .Values.tgspam.runAsGroup | default 1000 }}
{{- if and .Values.tgspam.service .Values.tgspam.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.tgspam.service.port | default 8080 }}
              protocol: TCP
{{- if and .Values.tgspam.livenessProbe .Values.tgspam.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.tgspam.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.tgspam.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.tgspam.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.tgspam.livenessProbe.failureThreshold | default 3 }}
{{- end }}
{{- if and .Values.tgspam.readinessProbe .Values.tgspam.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: {{ .Values.tgspam.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.tgspam.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.tgspam.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.tgspam.readinessProbe.failureThreshold | default 3 }}
{{- end }}
{{- end }}
{{- with .Values.tgspam.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
          env:
{{- if .Values.tgspam.env }}
{{- range $key, $value := .Values.tgspam.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- end }}
            - name: OPENAI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_TOKEN
                  optional: true
{{- if .Values.tgspam.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ tpl .Values.tgspam.envFromSecret . }}
{{- end }}
          volumeMounts:
            - name: tg-data
              mountPath: {{ .Values.tgspam.volumeMountPath }}
      volumes:
        - name: tg-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-tg-data
