apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-spam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-spam
  template:
    metadata:
      labels:
        app: tg-spam
    spec:
      containers:
        - name: tg-spam
          image: {{ .Values.tgspam.image }}
          env:
            - name: OPENAI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_TOKEN
                  optional: true
          {{- if and .Values.tgspam.args (gt (len .Values.tgspam.args) 0) }}
          args:
            {{- range .Values.tgspam.args }}
            - {{ . }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: tg-data
              mountPath: {{ .Values.tgspam.volumeMountPath }}
      volumes:
        - name: tg-data
          persistentVolumeClaim:
            claimName: tg-data

