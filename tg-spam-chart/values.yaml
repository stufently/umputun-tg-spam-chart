tgspam:
  image: ghcr.io/umputun/tg-spam:latest
  secretName: tg-spam-bots-secret
  env:
    ADMIN_GROUP: "-4660067109"
    # Настройки спама и прочее
    MAX_EMOJI: "3"
    META_LINKS_LIMIT: "3"
    META_USERNAME_SYMBOLS: "@"
    NO_SPAM_REPLY: "true"
    MIN_MSG_LEN: "10"
    DEBUG: "true"
    MULTI_LANG: "2"
    META_KEYBOARD: "true"
  volumeMountPath: /var/srv/data

secretName: tg-spam-bots-secret

storage:
  tgDataSize: 1Gi


