tgspam:
  image: ghcr.io/umputun/tg-spam:latest
  env:
    TELEGRAM_TOKEN: ""  # Токен бота от @BotFather
    ADMIN_GROUP: ""
    # Настройки спама и прочее
    MAX_EMOJI: "3"
    META_LINKS_LIMIT: "3"
    META_USERNAME_SYMBOLS: "@"
    NO_SPAM_REPLY: "true"
    MIN_MSG_LEN: "10"
    DEBUG: "true"
    MULTI_LANG: "2"
    META_KEYBOARD: "true"
  volumeMountPath: /srv/data
  # Настройки безопасности для работы с PVC
  fsGroup: 1000  # GID для fsGroup (обычно 1000 для пользователя app)
  runAsUser: 1000  # UID пользователя в контейнере
  runAsGroup: 1000  # GID группы в контейнере
  initContainer:
    enabled: true  # Включить initContainer для установки прав на PVC

storage:
  tgDataSize: 1Gi
  storageClass: "hcloud-volumes"  # Оставьте пустым для использования default StorageClass, или укажите нужный (например: "hcloud-volumes")


