tgspam:
  image:
    repository: ghcr.io/umputun/tg-spam
    # Если пусто — берётся `Chart.appVersion` (рекомендуемый способ — bumpить тег через
    # release чарта, а не override'ить в values/AppSet)
    tag: ""
    pullPolicy: IfNotPresent
  # Имя k8s Secret с дополнительными ENV (например TELEGRAM_TOKEN из VSO/Vault).
  # Поддерживается tpl-рендеринг — можно использовать `{{ .Release.Name }}`.
  # Пустая строка = не подключать envFrom.
  envFromSecret: "{{ .Release.Name }}"
  env:
    ADMIN_GROUP: ""
    # Настройки OpenAI
    OPENAI_MODEL: "gpt-5-mini"  # Модель OpenAI (gpt-5-mini, gpt-4o-mini и т.д.)
    OPENAI_CUSTOM_PROMPT: "Считай спамом любые сообщения о покупке, продаже или обмене USDT, криптовалюты."
    # Настройки спама и прочее
    MAX_EMOJI: "3"
    META_LINKS_LIMIT: "3"
    META_USERNAME_SYMBOLS: "@"
    NO_SPAM_REPLY: "true"
    MIN_MSG_LEN: "10"
    DEBUG: "true"
    MULTI_LANG: "2"
    META_KEYBOARD: "true"
    # HTTP server для blackbox /ping (только внутри кластера, ClusterIP)
    # /ping доступен без BasicAuth (rest.Ping middleware ставится до auth)
    SERVER_ENABLED: "true"
    SERVER_LISTEN: ":8080"
  # Service для blackbox HTTP probe внутри кластера
  service:
    enabled: true
    port: 8080
  # Probes используют /ping (без BasicAuth, ставится до auth middleware).
  # Требуют SERVER_ENABLED=true. Если HTTP сервер выключен — отключи здесь probes.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  volumeMountPath: /srv/data
  # Настройки безопасности для работы с PVC
  fsGroup: 1000  # GID для fsGroup (обычно 1000 для пользователя app)
  runAsUser: 1000  # UID пользователя в контейнере
  runAsGroup: 1000  # GID группы в контейнере
  initContainer:
    enabled: true  # Включить initContainer для установки прав на PVC

storage:
  tgDataSize: 1Gi
  storageClass: "hcloud-volumes"  # Оставьте пустым для использования default StorageClass, или укажите нужный (например: "hcloud-volumes")


