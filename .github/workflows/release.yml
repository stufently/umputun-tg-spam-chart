name: Release Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'tg-spam-chart/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create packages directory
        run: mkdir -p ./packages

      - name: Fetch previously published charts
        # GitHub Pages deploy заменяет весь сайт содержимым ./packages, а
        # `helm repo index` строит index заново только из локальных пакетов.
        # Чтобы не выкинуть старые версии чарта из repo (ломает rollback на
        # запинённую версию), подтягиваем ранее опубликованные index.yaml и
        # .tgz в ./packages и затем сливаем индекс через --merge.
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.repository }}"
          if curl -fsSL "$REPO_URL/index.yaml" -o ./packages/old-index.yaml; then
            echo "Existing index found, downloading referenced charts:"
            grep -Eo 'https?://[^ ]+\.tgz' ./packages/old-index.yaml | sort -u | while read -r url; do
              echo "  - $url"
              curl -fsSL "$url" -O --output-dir ./packages || echo "    (skip: $url unavailable)"
            done
          else
            echo "No existing index.yaml (first publish)"
          fi

      - name: Package chart
        run: |
          helm package tg-spam-chart --destination ./packages

      - name: List packaged files
        run: |
          ls -la ./packages/

      - name: Create index
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.repository }}"
          echo "Repository URL: $REPO_URL"
          if [ -f ./packages/old-index.yaml ]; then
            helm repo index ./packages --url "$REPO_URL" --merge ./packages/old-index.yaml
            rm -f ./packages/old-index.yaml
          else
            helm repo index ./packages --url "$REPO_URL"
          fi
          echo "Index file contents:"
          cat ./packages/index.yaml

      - name: Create index.html
        run: |
          REPO_NAME="${{ github.event.repository.name || github.repository }}"
          REPO_OWNER="${{ github.repository_owner }}"
          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '  <title>Helm Chart Repository</title>'
            echo '  <meta charset="utf-8">'
            echo '  <style>'
            echo '    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }'
            echo '    h1 { color: #333; }'
            echo '    code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }'
            echo '    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Helm Chart Repository</h1>'
            echo '  <p>This is a Helm chart repository for <code>tg-spam-chart</code>.</p>'
            echo '  <h2>Usage</h2>'
            echo '  <pre>helm repo add umputun-tg-spam https://'"${REPO_OWNER}"'.github.io/'"${REPO_NAME}"'
          helm repo update
          helm search repo umputun-tg-spam</pre>'
            echo '  <h2>Repository Index</h2>'
            echo '  <p><a href="index.yaml">View index.yaml</a></p>'
            echo '</body>'
            echo '</html>'
          } > ./packages/index.html

      - name: Verify files before deployment
        run: |
          echo "Files to be deployed:"
          ls -lah ./packages/
          echo ""
          echo "Checking index.yaml exists:"
          test -f ./packages/index.yaml && echo "✓ index.yaml found" || echo "✗ index.yaml missing"
          echo ""
          echo "Checking index.html exists:"
          test -f ./packages/index.html && echo "✓ index.html found" || echo "✗ index.html missing"
          echo ""
          echo "Checking chart package exists:"
          test -f ./packages/*.tgz && echo "✓ Chart package found" || echo "✗ Chart package missing"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./packages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

