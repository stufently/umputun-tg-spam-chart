name: Release Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'tg-spam-chart/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create packages directory
        run: mkdir -p ./packages

      - name: Package chart
        run: |
          helm package tg-spam-chart --destination ./packages

      - name: List packaged files
        run: |
          ls -la ./packages/

      - name: Create index
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || github.repository }}"
          echo "Repository URL: $REPO_URL"
          helm repo index ./packages --url "$REPO_URL"
          echo "Index file contents:"
          cat ./packages/index.yaml

      - name: Verify files before deployment
        run: |
          echo "Files to be deployed:"
          ls -lah ./packages/
          echo ""
          echo "Checking index.yaml exists:"
          test -f ./packages/index.yaml && echo "✓ index.yaml found" || echo "✗ index.yaml missing"
          echo ""
          echo "Checking chart package exists:"
          test -f ./packages/*.tgz && echo "✓ Chart package found" || echo "✗ Chart package missing"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

